# Netlify configuration for Angular SPA

[build]
  # Build command
  command = "npm run build"
  # Directory where the build output is located (the application builder emits a browser subdirectory)
  publish = "dist/schnittstellenpass/browser"

[build.environment]
  # Angular 22 requires Node ^22.22.3 || ^24.15.0 || >=26.0.0
  NODE_VERSION = "24"

[functions]
  # Serverless functions, e.g. the Spotify API proxy (netlify/functions/spotify.mts)
  directory = "netlify/functions"

# Decap CMS admin route
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Redirect all requests to index.html for Angular routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The CMS page holds the editor's GitHub token: scripts only from this site and
# the pinned Decap version on unpkg, no inline scripts. 'unsafe-eval' is needed
# because Decap validates its configuration with generated code. "/admin" is
# listed as well, in case the page is opened without the trailing slash.
[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-eval' https://unpkg.com/decap-cms@3.16.3/; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-eval' https://unpkg.com/decap-cms@3.16.3/; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-store"

# This project is deployed as a SPA via static files + rewrites. API calls that
# need secrets go through the functions in netlify/functions, which are served
# under /.netlify/functions/* and are not affected by the redirects above.
