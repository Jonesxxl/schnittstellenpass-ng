# Netlify configuration for Angular SPA

[build]
  # Build command
  command = "npm run build"
  # Directory where the build output is located (the application builder emits a browser subdirectory)
  publish = "dist/schnittstellenpass/browser"

[build.environment]
  # Angular 22 requires Node ^22.22.3 || ^24.15.0 || >=26.0.0
  NODE_VERSION = "24"

# Every production deploy costs Netlify credits. Skip the build when the changes
# since the last production build only touch files that are not part of the
# site: documentation, tests, editor settings and the CI workflow. Exit code 0 skips the build;
# any other result builds as usual. Always builds when there is no earlier build
# to compare with or nothing new was pushed, e.g. "Trigger deploy" in the
# Netlify UI after changing an environment variable.
[context.production]
  ignore = "test -n \"$CACHED_COMMIT_REF\" && test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude)*.md' ':(exclude)*.spec.ts' ':(exclude).editorconfig' ':(exclude).gitattributes' ':(exclude).vscode' ':(exclude).claude' ':(exclude).github'"

[functions]
  # Serverless functions, e.g. the Spotify API proxy (netlify/functions/spotify.mts)
  directory = "netlify/functions"

# Decap CMS admin route
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Pages are prerendered (src/app/app.routes.server.ts) into <page>/index.html.
# Served under the URL without trailing slash, as in the canonical links and
# public/sitemap.xml. Netlify ignores trailing slashes when matching rules.
[[redirects]]
  from = "/impressum"
  to = "/impressum/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/datenschutz"
  to = "/datenschutz/index.html"
  status = 200
  force = true

# Former sub pages of the old website, still linked and indexed elsewhere
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/episodes"
  to = "/#folgen"
  status = 301

[[redirects]]
  from = "/about"
  to = "/#ueber"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/#social"
  status = 301

# Everything else is a real 404 with public/404.html (Netlify's default for a
# missing file). There is no SPA fallback: a 200 for unknown URLs would make
# search engines index copies of the start page.

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    # (HSTS is added by Netlify itself for custom domains; setting it here as
    # well would send the header twice. X-XSS-Protection is left out on
    # purpose: browsers dropped the filter, and the CSP replaces it.)
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"

# Cache static assets
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The CMS page holds the editor's GitHub token: scripts only from this site
# (Decap is served from /vendor), no inline scripts. 'unsafe-eval' is needed
# because Decap validates its configuration with generated code and compiles
# WebAssembly; blob: in connect-src because it reads picked files for upload,
# localhost:8081 for the local decap-server (npx netlify dev, see README).
# Keep both blocks identical: "/admin" covers the page without trailing slash.
# (A /admin -> /admin/ redirect rule would loop, Netlify ignores trailing
# slashes when matching rules; Pretty URLs already forwards to /admin/.)
[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https: wss: blob: http://localhost:8081; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https: wss: blob: http://localhost:8081; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

# Decap CMS files (the .js files are also matched by /*.js above). Safe to
# cache for good: the folder name contains the version, and a new version is
# deployed together with the admin page that loads it.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Files uploaded through the CMS are only ever shown as images. Opened directly,
# an uploaded SVG must not run script on this origin, where the CMS keeps the
# editor's GitHub token.
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-store"

# This project is deployed as a SPA via static files + rewrites. API calls that
# need secrets go through the functions in netlify/functions, which are served
# under /.netlify/functions/* and are not affected by the redirects above.
