# Checks every pull request and every push to main before Netlify deploys it.
# Same commands as locally (see CLAUDE.md). npm ci fails when package-lock.json
# does not match package.json.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build
