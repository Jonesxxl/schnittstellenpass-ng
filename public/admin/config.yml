# Login with GitHub: everyone with write access to the repository can edit.
# Netlify handles the OAuth handshake (GitHub OAuth app installed under
# Project configuration > Access & security > OAuth, see README).
backend:
  name: github
  repo: Jonesxxl/schnittstellenpass-ng
  branch: main
  # Enough for a public repository; use "repo" if it ever becomes private
  auth_scope: public_repo
  # Netlify site that holds the OAuth provider, also when the CMS is opened on
  # a deploy preview (Decap itself always uses its demo site on localhost)
  site_domain: schnittstellenpass.de

local_backend: true

# Changes are saved as drafts (a branch with a pull request) and only go live
# once they are published in the CMS; Netlify builds a preview for each draft
publish_mode: editorial_workflow
show_preview_links: true

media_folder: "public/uploads"
public_folder: "/uploads"

editor:
  preview: false

collections:
  - name: "site_texts"
    label: "Website Texte"
    files:
      - name: "home_hero"
        label: "Home - Hero"
        file: "public/content/home-hero.json"
        format: "json"
        fields:
          - label: "Überschrift (1–3 Zeilen)"
            name: "titleLines"
            widget: "list"
            min: 1
            max: 3
            field:
              label: "Zeile"
              name: "line"
              widget: "string"
          - label: "Unterzeile"
            name: "subtitle"
            widget: "text"

      - name: "about_intro"
        label: "Home - Gastgeber"
        file: "public/content/ueber-uns.json"
        format: "json"
        fields:
          - { label: "Name", name: "headline", widget: "string" }
          - { label: "Text", name: "body", widget: "text" }
          - { label: "Portrait (Hochformat 4:5)", name: "portrait", widget: "image", required: false, choose_url: false }
          - label: "Fakten (bis zu 3)"
            name: "facts"
            widget: "list"
            max: 3
            fields:
              - { label: "Wert", name: "value", widget: "string" }
              - { label: "Beschriftung", name: "label", widget: "string" }

      - name: "live"
        label: "Home - Live"
        file: "public/content/live.json"
        format: "json"
        fields:
          - { label: "Banner ganz oben", name: "bannerText", widget: "string" }
          - { label: "Kleine Zeile über der Überschrift", name: "eyebrow", widget: "string" }
          - label: "Überschrift (1–3 Zeilen)"
            name: "headlineLines"
            widget: "list"
            min: 1
            max: 3
            field: { label: "Zeile", name: "line", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }
          - { label: "Kasten: Titel", name: "jubileeLabel", widget: "string" }
          - { label: "Kasten: Text", name: "jubileeText", widget: "text" }
          - { label: "Foto (Querformat 4:3)", name: "photo", widget: "image", required: false, choose_url: false }

      - name: "episodes"
        label: "Home - Neueste Folgen"
        file: "public/content/folgen.json"
        format: "json"
        fields:
          - { label: "Kleine Zeile über der Überschrift", name: "eyebrow", widget: "string" }
          - { label: "Überschrift", name: "headline", widget: "string" }
          - { label: "Einleitung", name: "intro", widget: "text" }
          # The episodes themselves are loaded from Spotify (newest first)

      - name: "social"
        label: "Home - Instagram"
        file: "public/content/social.json"
        format: "json"
        fields:
          - { label: "Kleine Zeile über der Überschrift", name: "eyebrow", widget: "string" }
          - { label: "Überschrift", name: "headline", widget: "string" }
