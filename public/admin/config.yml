backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

editor:
  preview: false

collections:
  - name: "site_texts"
    label: "Website Texte"
    files:
      - name: "home_hero"
        label: "Home - Hero"
        file: "public/content/home-hero.json"
        format: "json"
        fields:
          - label: "Überschrift (1–3 Zeilen)"
            name: "titleLines"
            widget: "list"
            min: 1
            max: 3
            field:
              label: "Zeile"
              name: "line"
              widget: "string"
          - label: "Unterzeile"
            name: "subtitle"
            widget: "text"

      - name: "about_intro"
        label: "Home - Gastgeber"
        file: "public/content/ueber-uns.json"
        format: "json"
        fields:
          - { label: "Name", name: "headline", widget: "string" }
          - { label: "Text", name: "body", widget: "text" }
