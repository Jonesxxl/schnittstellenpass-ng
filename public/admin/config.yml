# Login with GitHub: everyone with write access to the repository can edit.
# Netlify handles the OAuth handshake (GitHub OAuth app installed under
# Project configuration > Access & security > OAuth, see README).
backend:
  name: github
  repo: Jonesxxl/schnittstellenpass-ng
  branch: main
  # Enough for a public repository; use "repo" if it ever becomes private
  auth_scope: public_repo
  # Netlify site that holds the OAuth provider, also when the CMS is opened on
  # a deploy preview (Decap itself always uses its demo site on localhost)
  site_domain: schnittstellenpass.de
  # Readable titles for the drafts (pull requests) and commits
  commit_messages:
    create: "Neu: {{collection}} „{{slug}}“"
    update: "Geändert: {{collection}} „{{slug}}“"
    delete: "Gelöscht: {{collection}} „{{slug}}“"
    uploadMedia: "Foto hochgeladen: {{path}}"
    deleteMedia: "Foto gelöscht: {{path}}"

local_backend: true

# German user interface, link to the website and logo in the header
locale: de
site_url: https://schnittstellenpass.de
display_url: https://schnittstellenpass.de
logo:
  src: /assets/brand/logo-black.webp
  show_in_header: true

# Changes are saved as drafts (a branch with a pull request) and only go live
# once they are published in the CMS; Netlify builds a preview for each draft
publish_mode: editorial_workflow
show_preview_links: true

media_folder: "public/uploads"
public_folder: "/uploads"

# Live preview next to the form, styled like the website (admin/preview.js)
editor:
  preview: true

# Names (site_texts, home_hero, …) are part of the draft branch names: keep
# them, only labels and hints may change. The order matches the start page.
collections:
  - name: "site_texts"
    label: "Startseite"
    label_singular: "Bereich"
    description: >-
      Texte und Fotos der Startseite, in der Reihenfolge wie auf der Seite.
      Änderungen werden als Entwurf gespeichert und gehen erst online, wenn du
      sie unter „Arbeitsablauf“ veröffentlichst. Tipp: Sammle mehrere
      Änderungen und veröffentliche sie zusammen – jede Veröffentlichung ist
      ein neuer Deploy der Website.
    files:
      - name: "home_hero"
        label: "1 · Begrüßung (ganz oben)"
        file: "public/content/home-hero.json"
        format: "json"
        fields:
          - label: "Zeilen der Überschrift"
            name: "titleLines"
            widget: "list"
            label_singular: "Zeile"
            hint: "Große Schrift neben dem Logo. 1 bis 3 kurze Zeilen, jede Zeile wird auf der Website zu einer eigenen Zeile."
            min: 1
            max: 3
            collapsed: false
            field:
              label: "Zeile"
              name: "line"
              widget: "string"
              pattern: ["^.{1,30}$", "Bitte höchstens 30 Zeichen pro Zeile, sonst bricht sie auf dem Handy um."]
          - label: "Text darunter"
            name: "subtitle"
            widget: "text"
            hint: "Ein bis zwei Sätze, die den Podcast beschreiben."
            pattern: ["^[\\s\\S]{1,280}$", "Bitte höchstens 280 Zeichen."]

      - name: "live"
        label: "2 · Live-Bereich & Banner"
        file: "public/content/live.json"
        format: "json"
        fields:
          - label: "Banner ganz oben"
            name: "bannerText"
            widget: "string"
            hint: "Dunkle Leiste über der ganzen Seite, führt zum Live-Bereich. Kurz halten: auf dem Handy höchstens zwei Zeilen."
            pattern: ["^.{1,70}$", "Bitte höchstens 70 Zeichen."]
          - label: "Kleine Zeile über der Überschrift"
            name: "eyebrow"
            widget: "string"
            hint: "Zum Beispiel „Neu · seit 22.09.2026“."
          - label: "Zeilen der Überschrift"
            name: "headlineLines"
            widget: "list"
            label_singular: "Zeile"
            hint: "1 bis 3 kurze Zeilen in großer Schrift."
            min: 1
            max: 3
            collapsed: false
            field:
              label: "Zeile"
              name: "line"
              widget: "string"
              pattern: ["^.{1,24}$", "Bitte höchstens 24 Zeichen pro Zeile."]
          - label: "Text"
            name: "text"
            widget: "text"
            hint: "Beschreibung des Live-Formats, zwei bis drei Sätze."
          - label: "Infokasten: Titel"
            name: "jubileeLabel"
            widget: "string"
            hint: "Kleine Überschrift im umrandeten Kasten unter dem Text."
          - label: "Infokasten: Text"
            name: "jubileeText"
            widget: "text"
          - label: "Foto"
            name: "photo"
            widget: "image"
            required: false
            choose_url: false
            hint: "Querformat 4:3, mindestens 1600 Pixel breit, höchstens 3 MB. Leer lassen, um das bisherige Foto zu behalten."
            # Photos from a phone are often 5 MB and more; they would slow down the page
            media_library: { config: { max_file_size: 3000000 } }

      - name: "episodes"
        label: "3 · Neueste Folgen"
        file: "public/content/folgen.json"
        format: "json"
        fields:
          - label: "Kleine Zeile über der Überschrift"
            name: "eyebrow"
            widget: "string"
          - label: "Überschrift"
            name: "headline"
            widget: "string"
            hint: "Die Folgen selbst kommen automatisch von Spotify (die sechs neuesten) und müssen hier nicht gepflegt werden."
          - label: "Text rechts neben der Überschrift"
            name: "intro"
            widget: "text"

      - name: "about_intro"
        label: "4 · Gastgeber"
        file: "public/content/ueber-uns.json"
        format: "json"
        fields:
          - label: "Name"
            name: "headline"
            widget: "string"
            hint: "Große Überschrift im grünen Bereich."
          - label: "Text"
            name: "body"
            widget: "text"
            hint: "Kurze Vorstellung, drei bis vier Sätze."
          - label: "Portrait"
            name: "portrait"
            widget: "image"
            required: false
            choose_url: false
            hint: "Hochformat 4:5, mindestens 1000 Pixel breit, höchstens 3 MB. Leer lassen, um das bisherige Portrait zu behalten."
            media_library: { config: { max_file_size: 3000000 } }
          - label: "Fakten"
            name: "facts"
            widget: "list"
            label_singular: "Fakt"
            hint: "Bis zu drei Spalten der Anzeigetafel unter dem Text, zum Beispiel „45 min“ / „pro Folge“. Zahlen am Anfang werden beim Hineinscrollen hochgezählt."
            max: 3
            collapsed: false
            summary: "{{fields.value}} – {{fields.label}}"
            fields:
              - { label: "Wert (groß)", name: "value", widget: "string", pattern: ["^.{1,10}$", "Bitte höchstens 10 Zeichen."] }
              - { label: "Beschriftung (klein)", name: "label", widget: "string" }
              - { label: "Zusatz-Tafel (optional)", name: "extra", widget: "string", required: false, hint: "Kleine Tafel unter dem Wert wie die Nachspielzeit-Anzeige im Stadion, zum Beispiel „Nachspielzeit“. Ein „+“ wird davor gesetzt.", pattern: ["^.{0,14}$", "Bitte höchstens 14 Zeichen."] }

      - name: "social"
        label: "5 · Instagram"
        file: "public/content/social.json"
        format: "json"
        fields:
          - label: "Kleine Zeile über der Überschrift"
            name: "eyebrow"
            widget: "string"
          - label: "Überschrift"
            name: "headline"
            widget: "string"
            hint: "Die Beiträge selbst kommen automatisch von Instagram."
